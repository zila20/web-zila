<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pemesanan Kamar</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<header class="navbar">
  <div class="logo-container">
  <img src="image/logo-grandhotel.png" alt="Logo Grand Hotel" class="logo-img">
  <div class="logo-text">
    <h1>GRAND HOTEL</h1>
    <p>Luxury & Comfort</p>
  </div>
  </div>
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="rooms.html">Rooms</a></li>
      <li><a href="riwayat.html">Struk</a></li>
      <li><a href="laporan.html">Laporan</a></li>
      <li><a href="penilaian.html">Penilaian</a></li>
      <li><a href="akun.html" class="akun-icon"><i class="fa-solid fa-user"></i></a></li>
    </ul>
  </nav>
</header>

<section class="booking-form">
  <h2>Form Pemesanan</h2>

  <form id="bookingForm" method="POST" action="proses_pemesanan.php">
    <input type="hidden" name="tipe" id="tipe">
    <input type="hidden" name="kamar" id="kamar">
    <input type="hidden" name="harga" id="harga">

    <label>Nama:</label>
    <input type="text" name="nama" required>

    <label>Umur:</label>
    <input type="number" name="umur" required>

    <label>Jenis Kelamin:</label>
    <select name="jk">
      <option>Pria</option>
      <option>Wanita</option>
    </select>

    <label>Jumlah Orang:</label>
    <input type="number" name="orang" min="1" required>

    <label>Tanggal Check-in:</label>
    <input type="date" name="checkin" required>

    <label>Tanggal Check-out:</label>
    <input type="date" name="checkout" required>

    <label>Metode Pembayaran:</label>
    <select name="pembayaran" required>
      <option>BSI</option>
      <option>BCA</option>
      <option>Bank Aceh</option>
      <option>Pay at Hotel</option>
    </select>

    <button type="submit">Kirim Pemesanan</button>
  </form>

  <p id="result"></p>
</section>

<!-- Script JavaScript -->
<script>
  // Ambil data dari URL dan isi ke input hidden
  const params = new URLSearchParams(window.location.search);
  document.getElementById("tipe").value = params.get("type") || "";
  document.getElementById("kamar").value = params.get("room") || "";
  document.getElementById("harga").value = params.get("price") || "";

  // Kirim data form tanpa reload halaman
  document.getElementById("bookingForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const formData = new FormData(this);
    fetch("proses_pemesanan.php", {
  method: "POST",
  body: formData
})
.then(res => res.text())
.then(id => {
      if (id === "ERROR") {
          alert("❌ Terjadi kesalahan saat menyimpan data.");
          return;
      }

      // ✔️ tampilkan info total sementara
      document.getElementById("result").innerHTML =
        "Pemesanan diproses... <br>ID: " + id;

      // ✔️ redirect langsung ke STRUK (riwayat.php)
      window.location.href = "riwayat.php?id=" + id;
  })
  .catch(err => alert("❌ Error: " + err));
});
</script>

</body>
</html>
